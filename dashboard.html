<!DOCTYPE html>
<html>
<head>
    <title>Мой дрон</title>
    <style>
        body {
            background: linear-gradient(135deg, #0a0f2a, #0a0a2a, #000000);
            color: lime;
            font-family: monospace;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        button {
            background-color: #1a1a2e;
            color: #0ff0ff;
            font-size: 20px;
            padding: 12px 24px;
            border: 2px solid #0ff0ff;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #0ff0ff;
            color: #0a0f2a;
            box-shadow: 0 0 15px #0ff0ff;
            transform: scale(1.05);
        }
        .control-panel {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        div {
            margin-bottom: 15px;
            font-size: 18px;
        }

        #charge_bar {
            transition: width 0.3s ease;
        }

        #terrain {
            background-color: #0a0f2a;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #0ff0ff;
        }

        #camera-container {
            margin-top: 20px;
            background-color: #0a0f2a;
            border-radius: 10px;
            border: 2px solid #0ff0ff;
            padding: 15px;
            text-align: center;
        }
        
        #camera-label {
            color: #0ff0ff;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        #camera-placeholder {
            background-color: #000000;
            height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
            color: #666;
        }
        
        video, #real-camera {
            width: 100%;
            height: auto;
            max-height: 240px;
            border-radius: 5px;
        }

        #charging_status {
            margin-top: 10px;
            padding: 10px;
            background-color: #0a0f2a;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <h1>Система управления дроном</h1>
    <p>Система готова к полету | Версия 1.1</p>
    
    <div class="control-panel">
        <button onclick="poleteli()">ВЗЛЕТ</button>
        <button onclick="posadka()">ПОСАДКА</button>
        <button onclick="connectBoard()">ПОДКЛЮЧИТЬ ПЛАТУ</button>
        
        <button onclick="updateTelemetry()">ОБНОВИТЬ ДАННЫЕ</button>
        <button onclick="updateTerrain()">АНАЛИЗ МЕСТНОСТИ</button>
        <button onclick="connectCamera()">ПОДКЛЮЧИТЬ КАМЕРУ</button>
        <button onclick="toggleCharging()">ПОДКЛЮЧИТЬ ЗАРЯДКУ</button>
    </div>
    
    <div id="vysota">Высота: 0 метров</div>
    <div id="board_status">Плата: не подключена</div>
    
    <div>Заряд: <span id="charge_value">100</span>%</div>
    <div id="charging_status">Зарядное устройство не подключено</div>
    <div style="background-color: #333; width: 200px;">
        <div id="charge_bar" style="background-color: lime; width: 100%; height: 20px;"></div>
    </div>
    
    <div id="temperature">Температура: 0°C</div>
    <div id="terrain"> Местность: ---</div>
    <div> Сигнал радара: <span id="radar_signal">100</span>%</div>
    
    <div id="camera-container">
        <div id="camera-label">ТРАНСЛЯЦИЯ С КАМЕРЫ</div>
        <div id="camera-placeholder">
            <video id="real-camera" autoplay playsinline muted style="display:none;"></video>
            <span id="camera-status">Ожидание подключения</span><br>
            <span style="font-size: 12px;">(При подключении к плате здесь появится видео)</span>
        </div>
    </div>
    
    <script>
        let currentVysota = 0;
        let currentCharge = 100;
        let isCharging = false;
        let isBoardConnected = false;
        let chargingInterval = null;
        let telemetryInterval = null;
        let cameraStream = null;
        let ws = null;

        const MAX_HEIGHT = 120;
        const MIN_TAKEOFF_CHARGE = 15;

        function setBoardStatus(text, color) {
            const status = document.getElementById("board_status");
            status.innerText = "Плата: " + text;
            status.style.color = color;
        }

        function updateBatteryUI() {
            document.getElementById("charge_value").innerText = currentCharge;
            document.getElementById("charge_bar").style.width = currentCharge + "%";
            if (currentCharge < 20) {
                document.getElementById("charge_bar").style.backgroundColor = "red";
            } else if (currentCharge < 50) {
                document.getElementById("charge_bar").style.backgroundColor = "orange";
            } else {
                document.getElementById("charge_bar").style.backgroundColor = "lime";
            }
        }

        function connectBoard() {
            if (isBoardConnected) {
                alert("Плата уже подключена.");
                return;
            }

            setBoardStatus("подключение...", "#0ff0ff");

            // Для локальной проверки можно поднять WS-сервис платы на ws://localhost:8080
            try {
                ws = new WebSocket("ws://localhost:8080");
                ws.onopen = function() {
                    isBoardConnected = true;
                    setBoardStatus("подключена (WS)", "lime");
                    startTelemetryLoop();
                };

                ws.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        applyBoardData(data);
                    } catch (err) {
                        console.warn("Некорректные данные от платы:", err);
                    }
                };

                ws.onclose = function() {
                    isBoardConnected = false;
                    setBoardStatus("отключена", "#ff6600");
                    stopTelemetryLoop();
                };

                ws.onerror = function() {
                    fallbackBoardConnect();
                };
            } catch (error) {
                fallbackBoardConnect();
            }
        }

        function fallbackBoardConnect() {
            // Режим эмуляции, если реальная плата или WS недоступны
            setTimeout(function() {
                isBoardConnected = true;
                setBoardStatus("подключена (эмуляция)", "#0ff0ff");
                startTelemetryLoop();
            }, 900);
        }

        function applyBoardData(data) {
            if (typeof data.temperature === "number") {
                document.getElementById("temperature").innerText = "Температура: " + Math.floor(data.temperature) + "°C";
            }
            if (typeof data.radar === "number") {
                updateRadarSignal(data.radar);
            }
            if (typeof data.charge === "number") {
                currentCharge = Math.max(0, Math.min(100, Math.floor(data.charge)));
                updateBatteryUI();
            }
        }

        function startTelemetryLoop() {
            stopTelemetryLoop();
            telemetryInterval = setInterval(function() {
                updateTelemetry();
                updateTerrain();
            }, 1500);
        }

        function stopTelemetryLoop() {
            if (telemetryInterval) {
                clearInterval(telemetryInterval);
                telemetryInterval = null;
            }
        }

        function poleteli() {
            if (!isBoardConnected) {
                alert("Сначала подключите плату.");
                return;
            }
            if (currentCharge < MIN_TAKEOFF_CHARGE) {
                alert("Недостаточный заряд для взлета (минимум " + MIN_TAKEOFF_CHARGE + "%).");
                return;
            }
            if (currentVysota >= MAX_HEIGHT) {
                alert("Достигнут лимит высоты: " + MAX_HEIGHT + " м.");
                return;
            }
            currentVysota = currentVysota + 1;
            document.getElementById("vysota").innerText = "Высота: " + currentVysota + " метров";
            razryad();
        }

        function posadka() {
            currentVysota = currentVysota - 1;
            if (currentVysota < 0) currentVysota = 0;
            document.getElementById("vysota").innerText = "Высота: " + currentVysota + " метров";
        }

        function razryad() {
            currentCharge = currentCharge - 10;
            if (currentCharge < 0) currentCharge = 0;
            updateBatteryUI();
        }

        function updateTelemetry() {
            if (!isBoardConnected) {
                return;
            }
            let temp = 20 + Math.random() * 30;
            document.getElementById("temperature").innerText = "Температура: " + Math.floor(temp) + "°C";
        }

        function updateTerrain() {
            const terrainTypes = [
                " Холм", " Лес", " Поле", 
                " Вода", " Город", " Люди",
                " Снег", " Огонь", " Деревня"
            ];
            let randomTerrain = terrainTypes[Math.floor(Math.random() * terrainTypes.length)];
            let signalStrength = Math.floor(Math.random() * 100);
            
            document.getElementById("terrain").innerText = "Местность: " + randomTerrain;
            updateRadarSignal(signalStrength);
        }

        function updateRadarSignal(signalStrength) {
            const radar = document.getElementById("radar_signal");
            radar.innerText = signalStrength;

            if (signalStrength < 30) {
                radar.style.color = "red";
            } else if (signalStrength < 70) {
                radar.style.color = "orange";
            } else {
                radar.style.color = "lime";
            }
        }

        async function connectCamera() {
            const statusElem = document.getElementById("camera-status");
            const videoElem = document.getElementById("real-camera");

            if (!isBoardConnected) {
                alert("Сначала подключите плату, затем камеру.");
                return;
            }

            statusElem.innerText = "Запрос доступа к камере...";

            try {
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                }

                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });

                videoElem.srcObject = cameraStream;
                videoElem.style.display = "block";
                statusElem.innerText = "Камера подключена";
                statusElem.style.color = "lime";
            } catch (error) {
                statusElem.innerText = "Ошибка доступа к камере";
                statusElem.style.color = "red";
                console.error("Не удалось подключить камеру:", error);
            }
        }

        function startCharging() {
            if (isCharging) {
                alert("Зарядка уже подключена!");
                return;
            }
            
            if (currentCharge >= 100) {
                alert("Батарея уже полностью заряжена!");
                return;
            }
            
            isCharging = true;
            document.getElementById("charging_status").innerText = "ИДЕТ ЗАРЯДКА...";
            document.getElementById("charging_status").style.color = "#0ff0ff";
            
            chargingInterval = setInterval(function() {
                if (currentCharge < 100 && isCharging) {
                    currentCharge = currentCharge + 5;
                    if (currentCharge > 100) currentCharge = 100;
                    
                    updateBatteryUI();
                    
                    if (currentCharge >= 100) {
                        stopCharging();
                        alert("Батарея полностью заряжена!");
                    }
                } else {
                    stopCharging();
                }
            }, 500);
        }
        
        function stopCharging() {
            if (chargingInterval) {
                clearInterval(chargingInterval);
                chargingInterval = null;
            }
            isCharging = false;
            document.getElementById("charging_status").innerText = "ЗАРЯДНОЕ УСТРОЙСТВО ОТКЛЮЧЕНО";
            document.getElementById("charging_status").style.color = "#ff6600";
            
            setTimeout(function() {
                document.getElementById("charging_status").innerText = "Зарядное устройство не подключено";
                document.getElementById("charging_status").style.color = "#888";
            }, 2000);
        }
        
        function toggleCharging() {
            if (isCharging) {
                stopCharging();
            } else {
                startCharging();
            }
        }

        window.addEventListener("beforeunload", function() {
            if (chargingInterval) clearInterval(chargingInterval);
            if (telemetryInterval) clearInterval(telemetryInterval);
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
            }
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
            }
        });
    </script>
</body>
</html>
