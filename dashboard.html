<!DOCTYPE html>
<html>
<head>
    <title>Мой дрон</title>
        <style>
        body {
            background: linear-gradient(135deg, #0a0f2a, #0a0a2a, #000000);
            color: lime;
            font-family: monospace;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        button {
            background-color: #1a1a2e;
            color: #0ff0ff;
            font-size: 20px;
            padding: 12px 24px;
            border: 2px solid #0ff0ff;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #0ff0ff;
            color: #0a0f2a;
            box-shadow: 0 0 15px #0ff0ff;
            transform: scale(1.05);
        }
        .control-panel {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .control-panel {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        div {
            margin-bottom: 15px;
            font-size: 18px;
        }

        #charge_bar {
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <h1>Система управления дроном</h1>
    <p>Система готова к полёту | Версия 1.0</p>
    <div class="control-panel">
        <button onclick="poleteli()">ВЗЛЕТ</button>
        <button onclick="posadka()">ПОСАДКА</button>
        <button onclick="razryad()">РАЗРЯДИТЬ</button>
        <button onclick="updateTelemetry()">ОБНОВИТЬ ДАННЫЕ</button>
    </div>
<div id="vysota">Высота: 0 метров</div>
    <div>Заряд: <span id="charge_value">100</span>%</div>
    <div style="background-color: #333; width: 200px;">
        <div id="charge_bar" style="background-color: lime; width: 100%; height: 20px;"></div>
    </div>
        <div id="temperature">Температура: 0°C</div>
             <script>
        let currentVysota = 0;
        let currentCharge = 100;

        function poleteli() {
             if (currentCharge <= 0) {
                alert("Заряд 0%! Дрон не взлетит!");
                return;
            }
            currentVysota = currentVysota + 1;
            document.getElementById("vysota").innerText = "Высота: " + currentVysota + " метров";
            razryad();
        }

        function posadka() {
            currentVysota = currentVysota - 1;
            if (currentVysota < 0) currentVysota = 0;
            document.getElementById("vysota").innerText = "Высота: " + currentVysota + " метров";
        }

        function razryad() {
            currentCharge = currentCharge - 10;
            if (currentCharge < 0) currentCharge = 0;
            document.getElementById("charge_value").innerText = currentCharge;
            document.getElementById("charge_bar").style.width = currentCharge + "%";
        }

        function updateTelemetry() {
            let temp = Math.random() * 50;
            document.getElementById("temperature").innerText = "Температура: " + Math.floor(temp) + "°C";
        }
    </script>
</body>
</html>
