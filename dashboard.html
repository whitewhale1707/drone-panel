<!DOCTYPE html>
<html>
<head>
    <title>Мой дрон</title>
    <style>
        body {
            background: linear-gradient(135deg, #0a0f2a, #0a0a2a, #000000);
            color: lime;
            font-family: monospace;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        button {
            background-color: #1a1a2e;
            color: #0ff0ff;
            font-size: 20px;
            padding: 12px 24px;
            border: 2px solid #0ff0ff;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #0ff0ff;
            color: #0a0f2a;
            box-shadow: 0 0 15px #0ff0ff;
            transform: scale(1.05);
        }
        .control-panel {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        div {
            margin-bottom: 15px;
            font-size: 18px;
        }

        #charge_bar {
            transition: width 0.3s ease;
        }

        #terrain {
            background-color: #0a0f2a;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #0ff0ff;
        }

        #camera-container {
            margin-top: 20px;
            background-color: #0a0f2a;
            border-radius: 10px;
            border: 2px solid #0ff0ff;
            padding: 15px;
            text-align: center;
        }
        
        #camera-label {
            color: #0ff0ff;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        #camera-placeholder {
            background-color: #000000;
            height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
            color: #666;
        }
        
        video, #real-camera {
            width: 100%;
            height: auto;
            max-height: 240px;
            border-radius: 5px;
        }

        #charging_status {
            margin-top: 10px;
            padding: 10px;
            background-color: #0a0f2a;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <h1> Система управления дроном</h1>
    <p>Система готова к полёту | Версия 1.0</p>
    
    <div class="control-panel">
        <button onclick="poleteli()">ВЗЛЕТ</button>
        <button onclick="posadka()">ПОСАДКА</button>
        
        <button onclick="updateTelemetry()">ОБНОВИТЬ ДАННЫЕ</button>
        <button onclick="updateTerrain()"> АНАЛИЗ МЕСТНОСТИ</button>
        <button onclick="connectCamera()"> ПОДКЛЮЧИТЬ КАМЕРУ</button>
        <button onclick="toggleCharging()"> ПОДКЛЮЧИТЬ ЗАРЯДКУ</button>
    </div>
    
    <div id="vysota">Высота: 0 метров</div>
    
    <div>Заряд: <span id="charge_value">100</span>%</div>
    <div id="charging_status"> Зарядное устройство не подключено</div>
    <div style="background-color: #333; width: 200px;">
        <div id="charge_bar" style="background-color: lime; width: 100%; height: 20px;"></div>
    </div>
    
    <div id="temperature">Температура: 0°C</div>
    <div id="terrain"> Местность: ---</div>
    <div> Сигнал радара: <span id="radar_signal">100</span>%</div>
    
    <div id="camera-container">
        <div id="camera-label"> ТРАНСЛЯЦИЯ С КАМЕРЫ</div>
        <div id="camera-placeholder">
             <span id="camera-status">Ожидание подключения</span><br>
            <span style="font-size: 12px;">(При подключении к плате здесь появится видео)</span>
        </div>
    </div>
    
    <script>
        let currentVysota = 0;
        let currentCharge = 100;
        let isCharging = false;
        let chargingInterval = null;

        function poleteli() {
            if (currentCharge <= 0) {
                alert("Заряд 0%! Дрон не взлетит!");
                return;
            }
            currentVysota = currentVysota + 1;
            document.getElementById("vysota").innerText = "Высота: " + currentVysota + " метров";
            razryad();
        }

        function posadka() {
            currentVysota = currentVysota - 1;
            if (currentVysota < 0) currentVysota = 0;
            document.getElementById("vysota").innerText = "Высота: " + currentVysota + " метров";
        }

        function razryad() {
            currentCharge = currentCharge - 10;
            if (currentCharge < 0) currentCharge = 0;
            document.getElementById("charge_value").innerText = currentCharge;
            document.getElementById("charge_bar").style.width = currentCharge + "%";
        }

        function updateTelemetry() {
            let temp = Math.random() * 50;
            document.getElementById("temperature").innerText = "Температура: " + Math.floor(temp) + "°C";
        }

        function updateTerrain() {
            const terrainTypes = [
                " Холм", " Лес", " Поле", 
                " Вода", " Город", " Люди",
                " Снег", " Огонь", " Деревня"
            ];
            let randomTerrain = terrainTypes[Math.floor(Math.random() * terrainTypes.length)];
            let signalStrength = Math.floor(Math.random() * 100);
            
            document.getElementById("terrain").innerHTML = " Местность: " + randomTerrain;
            document.getElementById("radar_signal").innerText = signalStrength;
            
            if (signalStrength < 30) {
                document.getElementById("radar_signal").style.color = "red";
            } else if (signalStrength < 70) {
                document.getElementById("radar_signal").style.color = "orange";
            } else {
                document.getElementById("radar_signal").style.color = "lime";
            }
        }

        function connectCamera() {
            let statusElem = document.getElementById("camera-status");
            statusElem.innerHTML = " Запрос доступа к камере...";
            
            setTimeout(() => {
                statusElem.innerHTML = " Камера готова (эмуляция)";
                let placeholder = document.getElementById("camera-placeholder");
                placeholder.innerHTML = " <span id='camera-status'>Режим эмуляции. При подключении платы здесь будет видео.</span>";
            }, 1500);
        }

        function startCharging() {
            if (isCharging) {
                alert("Зарядка уже подключена!");
                return;
            }
            
            if (currentCharge >= 100) {
                alert("Батарея уже полностью заряжена!");
                return;
            }
            
            isCharging = true;
            document.getElementById("charging_status").innerHTML = "🔌 ИДЁТ ЗАРЯДКА... 🔌";
            document.getElementById("charging_status").style.color = "#0ff0ff";
            
            chargingInterval = setInterval(function() {
                if (currentCharge < 100 && isCharging) {
                    currentCharge = currentCharge + 5;
                    if (currentCharge > 100) currentCharge = 100;
                    
                    document.getElementById("charge_value").innerText = currentCharge;
                    document.getElementById("charge_bar").style.width = currentCharge + "%";
                    
                    if (currentCharge >= 100) {
                        stopCharging();
                        alert("Батарея полностью заряжена!");
                    }
                } else {
                    stopCharging();
                }
            }, 500);
        }
        
        function stopCharging() {
            if (chargingInterval) {
                clearInterval(chargingInterval);
                chargingInterval = null;
            }
            isCharging = false;
            document.getElementById("charging_status").innerHTML = "⚡ ЗАРЯДНОЕ УСТРОЙСТВО ОТКЛЮЧЕНО ⚡";
            document.getElementById("charging_status").style.color = "#ff6600";
            
            setTimeout(function() {
                document.getElementById("charging_status").innerHTML = "🔌 Зарядное устройство не подключено";
                document.getElementById("charging_status").style.color = "#888";
            }, 2000);
        }
        
        function toggleCharging() {
            if (isCharging) {
                stopCharging();
            } else {
                startCharging();
            }
        }
    </script>
</body>
</html>
